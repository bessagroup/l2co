defaults:
  - override hydra/job_logging: custom

design:
  input_space:
    - name: function_name
      class: CategoricalParameter
      categories: [
          "Ackley",
          "AckleyN2",
          "AckleyN3",
          "AckleyN4",
          "Adjiman",
          "Bartels",
          "Beale",
          "Bird",
          "BohachevskyN1",
          "BohachevskyN2",
          "BohachevskyN3",
          "Booth",
          "Branin",
          "Brent",
          "Brown",
          "BukinN6",
          "CrossInTray",
          "DeJongN5",
          "DeckkersAarts",
          "DixonPrice",
          "DropWave",
          "Easom",
          "EggCrate",
          "EggHolder",
          "GoldsteinPrice",
          "Griewank",
          "HappyCat",
          "Himmelblau",
          "HolderTable",
          "Keane",
          "Langermann",
          "Leon",
          "Levy",
          "LevyN13",
          "Matyas",
          "McCormick",
          "Michalewicz",
          "Periodic",
          # "PermDBeta",
          # "PermZeroDBeta",
          "Powell",
          "Qing",
          "Quartic",
          "Rastrigin",
          "Ridge",
          "Rosenbrock",
          "RotatedHyperEllipsoid",
          "Salomon",
          "SchaffelN1",
          "SchaffelN2",
          "SchaffelN3",
          "SchaffelN4",
          "Schwefel",
          "Schwefel2_20",
          "Schwefel2_21",
          "Schwefel2_23",
          "Shubert",
          "ShubertN3",
          "ShubertN4",
          "Sphere",
          "StyblinskiTang",
          "SumSquares",
          "Thevenot",
          "ThreeHump",
          "Trid",
          "XinSheYang",
          "XinSheYangN2",
          "XinSheYangN3",
          "XinSheYangN4",
          "Zakharov",
        ]
    - name: dimensionality
      class: CategoricalParameter
      categories: ["2", "3", "5", "10", "20"]
    - name: noise
      class: CategoricalParameter
      categories: ["0.0", "0.1"]
    - name: seed
      class: DiscreteParameter
      lower_bound: 0
      upper_bound: 1000000

  output_space:
    - name: status
      class: ConstantParameter
      value: ""

experimentdata:
  name: "benchmarkfunctions"
  sampler: RandomUniform
  seed: 1
  number_of_samples: 10

optimization:
  # optimizers_names: [Adam, PSO, CMAES, RandomSearch]
  lower_bound: -1.0
  upper_bound: 1.0
  sampler_name: LatinHypercube
  number_of_samples: 30
  iterations: 1000
  realizations: 3
  parallelization: True
  optimizers:
    - name: Adam
      class: Adam
    - name: CMAES
      class: CMAES
    - name: PSO
      class: PSO
    - name: RMSprop
      class: RMSprop
    - name: SGA
      class: SGA

files:
  dirname_raw: raw
  dirname_interactions: interactions
  dirname_features: features
  dirname_recommender: recommender

hpc:
  jobid: -1
  jobqueue_filename: "jobqueue"
