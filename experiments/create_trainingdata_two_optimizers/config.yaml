        "XinSheYangN4",
        "Zakharov",
      ]
  dimensionality:
    type: category
    categories: [2, 10, 25]
  noise:
    type: category
    categories: [0.0, 0.1]
  seed:
    type: int
    low: 0
    high: 1000000
  budget:
    type: constant
    value: 200

experimentdata:
  from_sampling:
    sampler: "random"
    seed: 2023
    n_samples: 100
    domain: ${domain}

mode: cluster

optimization:
  lower_bound: 0.0
  upper_bound: 1.0
  sampler_name: "latin"
  number_of_samples: 30
  realizations: 3
  parallelization: True
  optimizers:
    - name: CMAES
    - name: PSO
    - name: Adam
    - name: LBFGSB
  fraction_of_all_combinations: 0.5

recommender:
  create_recommender_dataset: False
  lower_bound_budget: 30
  n_augmented_samples: 9
  scaler: Standard

files:
  dirname_raw: raw
  dirname_movxarr: post

hpc:
  jobid: -1

log_level: 20
