defaults:
  - override hydra/job_logging: custom

domain:
  input_space:
    n_layers:
      _target_: f3dasm.DiscreteParameter
      lower_bound: 2
      upper_bound: 10
    n_units:
      _target_: f3dasm.DiscreteParameter
      lower_bound: 6
      upper_bound: 40
    optimizer:
      _target_: f3dasm.CategoricalParameter
      categories: ["adam", "rmsprop", "sgd"]
    activation:
      _target_: f3dasm.CategoricalParameter
      categories: ["relu", "tanh", "sigmoid"]

files:
  raw_data: "/home/martin/Documents/GitHub/L2CO/experiments/create_trainingdata/outputs/2023-08-24/15-24-59/movxarr"
  experimentdata_file: architecture_search

experimentdata:
  from_sampling:
    _target_: f3dasm.sampling.RandomUniform
    seed: 42
    number_of_samples: 30
  mode: "cluster"

hpc:
  jobid: -1
