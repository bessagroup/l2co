defaults:
- model: lstmmlpstage0


domain:
  model.mlp_depth:
    type: category
    categories:
      - 2
      - 3
      - 5
  model.mlp_width:
    type: category
    categories:
      - 16
      - 32
      - 64
  model.lstm_hidden_size:
    type: category
    categories:
      - 16
      - 32
  model.lstm_latent_size:
    type: category
    categories:
      - 8
      - 16
      - 32

experimentdata:
  from_sampling:
    sampler: "random"
    seed: 2036
    n_samples: 20
    domain: ${domain}

seed: 42
rel_tolerance: 0.0

epochs: 500
optimizer:
  _target_: optax.adam
  learning_rate: 1e-3

n_optimizers: 4

saved_parameters: "/home/martin/Documents/scratchbook/sep17/model.eqx"
# numpy_data: '/home/martin/Documents/scratchbook/sep17/'
path_opt_dyn: '/home/martin/Documents/scratchbook/sep17/traj_data'

hpc:
  jobid: -1

feature_types:
  convex: categorical
  multimodal: categorical
  seperable: categorical
  noise: categorical
  dim: ordinal
  differentiable: categorical