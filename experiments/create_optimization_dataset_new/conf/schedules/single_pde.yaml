optimizers:
  cmaes:
    optimizer: cmaes
    hyperparameters:
      popsize: 30
  adam_1e-1:
    optimizer: adam
    hyperparameters:
      learning_rate: 1e-1
  pso:
    optimizer: pso
    hyperparameters:
      popsize: 30
  lbfgsb:
    optimizer: lbfgsb
    hyperparameters:
      memory_size: 100

schedules:
  optimizer_1:
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.cmaes}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.adam_1e-1}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.pso}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.lbfgsb}

data_generation:
  data_generator:
    _target_: l2co._src.optimizerschedule.get_single
    _partial_: True
  kwargs:


partition_factor: 1.0