optimizers:
  cmaes:
    optimizer: cmaes
    hyperparameters:
      popsize: 30
  adam_1e-3:
    optimizer: adam
    hyperparameters:
      learning_rate: 1e-3
  adam_1e-1:
    optimizer: adam
    hyperparameters:
      learning_rate: 1e-1
  pso:
    optimizer: pso
    hyperparameters:
      popsize: 30
  lbfgsb:
    optimizer: lbfgsb

schedules:
  optimizer_1:
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.cmaes}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.adam_1e-3}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.adam_1e-1}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.pso}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.lbfgsb}
  optimizer_2:
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.cmaes}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.adam_1e-3}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.adam_1e-1}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.pso}
    - _target_: l2co.OptimizationStep.from_yaml
      config: ${schedules.optimizers.lbfgsb}

data_generation:
  data_generator:
    _target_: l2co._src.optimizerschedule.get_combination
    _partial_: True
  kwargs:
    switch: 0.2

fraction_combinations: 0.75