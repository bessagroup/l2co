defaults:
- tasks: benchmark

optimizers:
  - optimizer: cmaes
    hyperparameters:
      popsize: 30
  - optimizer: adam
    hyperparameters:
      learning_rate: 1e-3
  - optimizer: pso
    hyperparameters:
      popsize: 30
  - optimizer: lbfgsb

optimization:
  switch: 0.1
  n_evals: 1000
  n_realizations: 3
  lower_bound: 0.0
  upper_bound: 1.0

fraction_combinations: 0.05

seed: 6528
mode: mpi

log_level: 20

hpc:
  jobid: -1