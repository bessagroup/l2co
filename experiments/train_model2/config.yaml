hydra:
  job:
    chdir: True
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Data & Core Settings
path: /Volumes/T7/data/156726
t: 0.01
t_end: 10000
opts: ["lbfgs", "sepcmaes", "adam_learning_rate=0.01", "pso"]

# Data Filtering Schema
schema:
  dimensionality: continuous
  separable: boolean
  unimodal: boolean

# Model Architecture
model:
  history_encoder:
    hidden_size: 16
    out_size: 4
  embedding:
    dim: 4
  mlp:
    width_size: 16
    depth: 3
    in_size: 12

# Training Hyperparameters
train:
  learning_rate: 1e-2
  num_steps: 1000
  seed: 2
  verbose: True