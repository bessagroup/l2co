defaults:
  - override hydra/job_logging: custom

design:
  input_space:
    - name: solver
      class: CategoricalParameter
      categories: ["lbfgs", "sgd", "adam"]
    - name: activation
      class: CategoricalParameter
      categories: ["identity", "logistic", "tanh", "relu"]
    - name: layers
      class: DiscreteParameter
      lower_bound: 3
      upper_bound: 16
    - name: neurons
      class: DiscreteParameter
      lower_bound: 2
      upper_bound: 32

  output_space:
    - name: status
      class: ConstantParameter
      value: ""

mlp:
  alpha: 0.0001
  seed: 42

experimentdata:
  name: "mlp_architecturesearch"
  sampler: RandomUniform
  seed: 1
  number_of_samples: 10

files:
  train_dirname_raw: '/media/martin/MARTIN USB/data/520508.hpc06.hpc'
  test_dirname_raw: '/media/martin/MARTIN USB/data/520412.hpc06.hpc'
  dirname_mov: 'mov'

  # dirname_raw: raw
  # dirname_interactions: interactions
  # dirname_features: features
  # dirname_recommender: recommender

hpc:
  jobid: -1
  jobqueue_filename: "jobqueue"
