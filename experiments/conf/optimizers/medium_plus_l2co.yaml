# Medium optimizer set extended with the L2CO learned optimizer.
# The L2CO model paths are required (???); pass your trained checkpoints, e.g.
#   optimizers.4.hyperparameters.stage0_model=/path/to/stage0/model
#   optimizers.4.hyperparameters.stage1_model=/path/to/stage1/model
- optimizer: sepcmaes
- optimizer: adam
  hyperparameters:
    learning_rate: 1e-2
- optimizer: lbfgs
- optimizer: pso
- optimizer: l2co
  hyperparameters:
    stage0_model: ???
    stage1_model: ???
    t: 0.01  # Softmax temperature for strategy selection (lower = more greedy)
    swap_optimizers: