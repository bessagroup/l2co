# Hyperparameter search domain for Stage1 model grid search
# Each combination produces one row in ExperimentData; all are trained in parallel
input:
  history_encoder.hidden_size:
    type: category
    categories:
      - 8
      - 16
      - 32
  mlp.width_size:
    type: category
    categories:
      - 8
      - 16
      - 32
  mlp.depth:
    type: category
    categories:
      - 2
      - 3
      - 4
