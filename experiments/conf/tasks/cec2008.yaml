sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
          - 'F12008'
          - 'F22008'
          - 'F32008'
          - 'F42008'
          - 'F52008'
          - 'F62008'
      dimensionality:
        type: category
        categories:
          - 100
          - 500
          - 1000
task_kwargs:
  seed: ${seed}
  noise: 0.0
  offset: False
  scale_output: False

data_generator:
  _target_: l2co._src.tasks.benchmark_task.create_benchmark_task
  _partial_: True

bounded:
  lower_bound: 0.0
  upper_bound: 1.0