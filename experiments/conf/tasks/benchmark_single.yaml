sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories: [
          'levy',
          ]
      dimensionality:
        type: category
        categories:
          - 10
task_kwargs:
  seed: ${seed}
  noise: 0.0
  offset: False

data_generator:
  _target_: l2co._src.tasks.benchmark_task.create_benchmark_task
  _partial_: True

bounded:
  lower_bound: 0.0
  upper_bound: 1.0