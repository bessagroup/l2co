defaults:
- tasks: gaussian_classification         # task distribution (see conf/tasks/)
- budgets: gaussian_classification     # evaluation budget function (see conf/budgets/)
- samplers: normal          # initial sampling strategy (see conf/samplers/)
- optimizers: l2co        # set of optimizers to run (see conf/optimizers/)
- experimentdata: default   # f3dasm ExperimentData domain definition
- cluster: local            # cluster settings (see conf/cluster/); override with cluster=brown
- _self_

# Number of independent optimization runs per task (different random seeds)
n_realizations: 25

# Global random seed for reproducibility
seed: 469

# Number of discrete timesteps used when interpolating trajectories into the combined dataset
budget_steps: 1000

# Print per-job progress to stdout
verbose: False
# Clear JAX compilation cache between jobs to limit memory growth
clear_jax_cache: True
# Store the initial sample points alongside the loss history in the output
save_input_parameters: False

# Root directory for pipeline outputs; null uses the pipeline default (cwd/outputs)
rootdir: null

# mode of executing the pipeline. This is overwritten if on a cluster
mode: local