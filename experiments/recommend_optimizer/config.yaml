domain:
  seed:
    type: int
    low: 0
    high: 1000000
  

experimentdata:
  from_sampling:
    sampler: random
    seed: 2023
    n_samples: 1
    domain: ${domain}

seed: 88

t_switch: 200
t_start: 0
iterations: 2000

test_size: 0.2

rel_tolerance: 0.01
epochs: 3
batch_size: 16

n_optimizers: 4

data:
  training_project_dir: /media/martin/T7/data/4155603
  testing_project_dir:
  ela_project_dir: /media/martin/T7/data/4155603

stage0_clf:
  _target_: sklearn.ensemble.GradientBoostingClassifier
  loss: 'log_loss'
  learning_rate: 0.01
  n_estimators: 1000
  max_depth: 6

stage1_clf:
  _target_: l2co._src.stage1_model.HybridModel
  lstm_features: 32
  mlp_features: 32
  mlp_layers: 2
  n_labels: 4


feature_types:
  convex: categorical
  multimodal: categorical
  seperable: categorical
  noise: categorical
  dim: ordinal
  differentiable: categorical

hpc:
  jobid: -1