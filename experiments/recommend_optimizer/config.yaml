defaults:
  - override hydra/job_logging: custom

domain:
  stage0_clf.n_estimators:
    type: category
    categories: [200] #[10, 50, 100, 200, 500]

  stage0_clf.learning_rate:
    type: category
    categories: [0.1] #[0.1, 0.01, 0.5, 1.0]

  stage0_clf.max_depth:
    type: category
    categories: [10] #[3, 6, 10]

  stage0_clf.loss:
    type: category
    categories: ['log_loss'] #['log_loss', 'exponential']

  rel_tolerance:
    type: category
    categories: [0.005] #[0.0, 0.01, 0.1, 0.2]

  stage1_clf.latent_dim:
    type: category
    categories: [32] #[16, 32, 64, 128]

experimentdata:
  from_sampling:
    sampler: "grid"
    seed: 2023
    n_samples:
    domain: ${domain}

data:
  training_project_dir: /media/martin/T7/data/benchmark_0.1
  testing_project_dir:
  ela_project_dir: /media/martin/T7/data/benchmark_0.1

seed: 88

t_switch: 200
t_start: 0
iterations: 2000

test_size: 0.2

rel_tolerance: 0.01
epochs: 3
batch_size: 16

n_optimizers: 4

stage0_clf:
  _target_: sklearn.ensemble.GradientBoostingClassifier
  loss: 'log_loss'
  learning_rate: 0.1
  n_estimators: 1000
  max_depth: 6

stage1_clf:
  path: #/home/martin/Documents/GitHub/L2CO/experiments/recommend_optimizer/outputs/2024-03-28/16-23-34
  latent_dim: 32
  optimizer: adam

feature_types:
  convex: categorical
  multimodal: categorical
  seperable: categorical
  noise: categorical
  dim: ordinal
  differentiable: categorical

hpc:
  jobid: -1