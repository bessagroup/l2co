defaults:
  - override hydra/job_logging: custom

design:
  lower_bound: -1.0
  upper_bound: 1.0
  # dimensionality_lower_bound: 2
  # dimensionality_upper_bound: 10
  dimensionality_list: [2, 5, 20, 100]

function:
  noise: 0.2

optimizers:
  optimizers_names: [Adam, PSO, CMAES, RandomSearch]

# CG,
# SimulatedAnnealing,
# LBFGSB,
# NelderMead,
# SGA,
# XNES,
# RMSprop,
# Nadam,
# Adamax,
# Ftrl,
sampler:
  sampler_name: LatinHypercube
  number_of_samples: 30

execution:
  number_of_functions: 100
  iterations: 200
  realizations: 10
  parallelization: True

hpc:
  jobid: 1
