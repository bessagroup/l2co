[metadata]
name = l2co
version = file: VERSION
author = Martin van der Schelling
author_email = M.P.vanderSchelling@tudelft.nl
description = Learning to Choose Optimizers
long_description = file: README.md
long_description_content_type = text/markdown
keywords = meta-learning, optimization, machine learning
url = https://github.com/bessagroup/L2CO
license = MIT License
license_files = file: LICENSE
classifiers =
	Development Status :: 4 - Beta
	Environment :: Console
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Physics
    License :: OSI Approved :: MIT License
	Natural Language :: English
	Programming Language :: Python :: 3
	
[options]
package_dir=
    =src
packages=find:
include_package_data = True
python_requires = >=3.10
install_requires = file: requirements.txt

[options.extras_require]
all =
    panel
	
[options.packages.find]
where=src

[tool:pytest]
pythonpath = . src
addopts = --cov=l2co
minversion = 6.0
testpaths =
    tests
markers = 
    requires_dependency(name): mark the test as it requires a certain dependency
