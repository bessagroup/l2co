name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write  # the action pushes the version tag and creates the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        # Same release action as l2co-tasks and l2co-optimizers. On a push to
        # main it compares the pyproject version with PyPI; if it is newer, it
        # builds, runs the test-script against the sdist and the wheel, uploads
        # to PyPI, then pushes the tag v<version> and creates the GitHub
        # release. A version whose tag already exists must not be released
        # this way: the upload succeeds and the tag push then fails.
        uses: patrick-kidger/action_update_python_project@v8
        with:
          python-version: "3.12"
          # Runs in a fresh temp dir against the built sdist/wheel.
          # --no-sources drops the `../<sibling>` editable paths in
          # [tool.uv.sources], so f3dasm, l2co-tasks, l2co-optimizers and
          # bessaplots resolve from PyPI -- the combination a user installs.
          # experiments/ is copied only for the test that walks it
          # (tests/unit/test_experiments_no_private_imports.py). Slow tests
          # are left out, as in the pull-request workflow.
          test-script: |
            cp -r ${{ github.workspace }}/tests ./tests
            cp -r ${{ github.workspace }}/experiments ./experiments
            cp ${{ github.workspace }}/pyproject.toml ./pyproject.toml
            uv sync --extra tests --no-install-project --inexact --no-sources
            uv run --no-sync pytest -m "not slow"
          pypi-token: ${{ secrets.pypi_token }}
          github-user: bessagroup
          github-token: ${{ github.token }}
          # l2co is not on PyPI yet; without this the action refuses to
          # create the project. Drop it once 1.8.1 is published, to match
          # l2co-tasks and l2co-optimizers.
          allow-first-release: true
