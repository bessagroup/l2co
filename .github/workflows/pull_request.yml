name: Pull request
on:
  pull_request:

# Sibling repos resolved via [tool.uv.sources] in pyproject.toml.
# CI clones them into the parent directory of the checkout so the editable
# paths (../l2co-tasks, ../f3dasm, ../bessaplots) resolve as they do locally.
# A repository secret BESSAGROUP_READ_TOKEN with read access to each sibling
# repo is required while the sibling repos are still private.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # Lint needs only ruff — not the project or its (private) sibling deps,
      # so we install ruff directly instead of '.[dev]'.
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Ruff check
        run: ruff check
      - name: Ruff format check
        run: ruff format --check

  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: ["3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout l2co
        uses: actions/checkout@v4
        with:
          path: l2co
      - name: Checkout l2co-tasks (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/l2co-tasks
          path: l2co-tasks
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Checkout f3dasm (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/f3dasm
          path: f3dasm
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Checkout bessaplots (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/bessaplots
          path: bessaplots
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        # NOTE: deliberately NOT passing --no-sources; uv must resolve the
        # editable sibling deps declared under [tool.uv.sources].
        working-directory: l2co
        run: uv sync --extra tests
      - name: Run tests (excluding slow)
        working-directory: l2co
        run: uv run pytest -m "not slow" --cov=l2co --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: l2co/coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Check distribution metadata
        run: |
          uv pip install --system twine
          twine check dist/*

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2co
        uses: actions/checkout@v4
        with:
          path: l2co
      - name: Checkout l2co-tasks
        uses: actions/checkout@v4
        with:
          repository: bessagroup/l2co-tasks
          path: l2co-tasks
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Checkout f3dasm
        uses: actions/checkout@v4
        with:
          repository: bessagroup/f3dasm
          path: f3dasm
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Checkout bessaplots
        uses: actions/checkout@v4
        with:
          repository: bessagroup/bessaplots
          path: bessaplots
          token: ${{ secrets.BESSAGROUP_READ_TOKEN }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install docs extras
        working-directory: l2co
        run: uv sync --extra docs
      - name: Build documentation
        working-directory: l2co
        run: uv run mkdocs build

  check_pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # pre-commit hooks (ruff-pre-commit, local toml-sort) run in their own
      # isolated envs, so only pre-commit itself is needed — not the project
      # or its (private) sibling deps.
      - name: Install pre-commit
        run: uv pip install --system pre-commit
      - name: Run pre-commit checks
        run: pre-commit run --all-files
