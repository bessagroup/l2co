name: Build docs
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2co
        uses: actions/checkout@v4
        with:
          path: l2co
      - name: Checkout l2co-tasks (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/l2co-tasks
          path: l2co-tasks
      - name: Checkout l2co-optimizers (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/l2co-optimizers
          path: l2co-optimizers
      - name: Checkout f3dasm (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/f3dasm
          path: f3dasm
      - name: Checkout bessaplots (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/bessaplots
          path: bessaplots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install docs extras
        working-directory: l2co
        run: uv sync --extra docs
      - name: Build docs
        working-directory: l2co
        run: uv run mkdocs build
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: l2co/site
