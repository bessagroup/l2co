[project]
name = "l2co"
version = "1.2.1"
description = "A library for learning to choose optimizers."
readme = "README.md"
authors = [
    {name = "M.P. van der Schelling", email = "m.p.vanderschelling@tudelft.nl"}
]
maintainers = [
    {name = "M.P. van der Schelling", email = "m.p.vanderschelling@tudelft.nl"}
]
classifiers = [

]

license = {text = "BSD-3-Clause"}

requires-python = ">=3.10"
dependencies = [
    "bottleneck>=1.5.0",
    "cloudpickle>=3.1.1",
    "dask>=2025.7.0",
    "equinox>=0.13.0",
    "evosax>=0.2.0",
    "f3dasm>=2.0.1",
    "grain>=0.2.11",
    "joblib>=1.5.1",
    "netcdf4>=1.7.2",
    "numpy>=2.2.6",
    "opfunu",
    "optax>=0.2.5",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
    "xarray>=2025.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E226",
    "E3",
    "E731",
    "C901",
]

exclude = [
    "__pycache__",
    "dist",
	"*.egg",
	"docs/source",
	"tests",
	".git",
	"experiments/*",
	"notebooks",
	"tests/*",
	"src/l2co/app.py",
]

[tool.uv]
package = true

[tool.uv.sources]
opfunu = { git = "https://github.com/mpvanderschelling/opfunu", rev = "jaxnumpy" }
