[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
classifiers = [
]
dependencies = [
  "bbob-jax>=1.6.2",
  "bessaplots>=0.4.0",
  "cloudpickle>=3.1.1",
  "dask>=2025.7.0",
  "equinox>=0.13.0",
  "evosax>=0.2.0",
  "f3dasm",
  "jax",
  "jax-tqdm>=0.4.0",
  "jaxtyping>=0.3.2",
  "netcdf4>=1.7.3",
  "optax<=0.2.4",
  "scikit-learn>=1.7.1",
  "matplotlib>=3.10.7",
  "tqdm>=4.67.1"
]
description = "A library for learning to choose optimizers."
license = "BSD-3-Clause"
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
name = "l2co"
readme = "README.md"
requires-python = ">=3.12"
version = "1.3.1"

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "ipykernel>=7.1.0",
  "pre-commit>=4.5.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs-gen-files>=0.6.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.7.0",
  "mkdocstrings>=1.0.0",
  "mkdocstrings-python>=2.0.0",
  "pymdown-extensions>=10.17.2"
]
tests = [
  "pytest>=8.4.2"
]

[project.urls]
Repository = "https://github.com/bessagroup/l2co"

[tool.ruff]
extend-exclude = [
  "notebooks",
  "docs/*.ipynb"
]
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  "docs/source",
  "tests",
  ".git",
  "experiments/*",
  "notebooks",
  "tests/*"
]
fixable = [
  "I001",
  "F401",
  "UP"
]
ignore = [
  "E226",
  "E402",
  "E721",
  "E3",
  "E731",
  "C901",
  "F722"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP" # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
package = true

[tool.uv.sources]
bessaplots = {editable = true, path = "../bessaplots"}
f3dasm = {editable = true, path = "../f3dasm"}
