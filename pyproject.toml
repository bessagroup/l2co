[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "bbob-jax>=1.6.5",
  "bessaplots>=0.4.0",
  "cloudpickle>=3.1.1",
  "dask>=2025.7.0",
  "equinox>=0.13.0,<0.14",
  "evosax>=0.2.0,<0.3",
  "f3dasm",
  "hydra-core>=1.3.2",
  "jax>=0.4.30,<0.9",
  "jax-tqdm>=0.4.0",
  "jaxtyping>=0.3.2",
  "l2co-tasks",
  "netcdf4>=1.7.3",
  "omegaconf",
  "optax>=0.2.5",
  "scikit-learn>=1.7.1",
  "matplotlib>=3.10.7",
  "tqdm>=4.67.1",
  "bottleneck>=1.6.0"
]
description = "A library for learning to choose optimizers."
license = "BSD-3-Clause"
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
name = "l2co"
readme = "README.md"
requires-python = ">=3.12"
version = "1.3.1"

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "ipykernel>=7.1.0",
  "pre-commit>=4.5.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs-gen-files>=0.6.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.7.0",
  "mkdocstrings>=1.0.0",
  "mkdocstrings-python>=2.0.0",
  "pymdown-extensions>=10.17.2"
]
tests = [
  "pytest>=8.4.2"
]

[project.urls]
Documentation = "https://github.com/bessagroup/l2co"
Issues = "https://github.com/bessagroup/l2co/issues"
Repository = "https://github.com/bessagroup/l2co"

[tool.hatch.build.targets.sdist]
include = [
  "src/l2co",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff"
]

[tool.hatch.build.targets.wheel]
packages = ["src/l2co"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "slow: tests that exercise full JAX rollouts and are excluded from the default PR run"
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  "notebooks",
  "docs/*.ipynb"
]
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  "docs/source",
  "tests",
  ".git",
  "experiments/*",
  "notebooks",
  "tests/*"
]
fixable = [
  "I001",
  "F401",
  "UP"
]
ignore = [
  "E226",
  "E402",
  "E721",
  "E3",
  "E731",
  "C901",
  "F722"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP" # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
package = true

[tool.uv.sources]
bessaplots = {editable = true, path = "../bessaplots"}
f3dasm = {editable = true, path = "../f3dasm"}
l2co-tasks = {editable = true, path = "../l2co-tasks"}
